name: archive

on:
  schedule:
    - cron: "23 */3 * * *"   # every 3 hours (UTC); GitHub may delay under load
  workflow_dispatch:           # manual run button in the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch flight events
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
        run: python fetch_flights.py
      - name: Commit data
        run: |
          git config user.name  "archive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/flights.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "data: update $(date -u +%FT%TZ)"
            git push
          fi
